# =====================================================================
# application.properties - Central configuration for SecureTask Backend
#
# IMPORTANT: In a real project, sensitive values (DB password, JWT secret)
# should NEVER be hardcoded here. Instead, use environment variables.
# Example: spring.datasource.password=${DB_PASSWORD}
#
# For local development, values below are given directly.
# Change DB credentials to match your local MySQL installation.
# =====================================================================

# =====================================================================
# SERVER CONFIGURATION
# =====================================================================
# The embedded Tomcat server will listen on port 8080
server.port=8080

# =====================================================================
# DATABASE CONFIGURATION (H2 In-Memory for Zero-Config Execution)
# Note: To switch to MySQL, uncomment the MySQL block below
# =====================================================================
spring.datasource.url=jdbc:h2:mem:securetaskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# MySQL Alternative (uncomment if using local MySQL):
# spring.datasource.url=jdbc:mysql://localhost:3306/securetask_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_password

# =====================================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================================
# hibernate.ddl-auto=update → Hibernate automatically creates/updates tables
# to match your entity classes. For production, use 'validate' or 'none'.
# For a fresh setup, you can set it to 'create' once, then switch to 'update'.
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in the console — useful for learning and debugging
# Set to false in production to avoid log noise
spring.jpa.show-sql=true

# Format the SQL output for better readability during development
spring.jpa.properties.hibernate.format_sql=true

# Dialect is auto-detected by Hibernate based on the active JDBC driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================================
# JWT CONFIGURATION
# =====================================================================
# jwt.secret: The secret key used to sign JWT tokens.
# In production, use a strong random string (at least 256 bits for HS256).
# Replace this with an environment variable: ${JWT_SECRET}
jwt.secret=SecureTaskJwtSecretKeyThatIsLongEnoughForHS256Algorithm123456789

# jwt.expiration: How long a JWT token remains valid (in milliseconds)
# 86400000 ms = 24 hours
jwt.expiration=86400000

# =====================================================================
# LOGGING
# =====================================================================
# Show Spring Security and Hibernate activity in the console
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
